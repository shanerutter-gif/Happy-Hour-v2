<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Spotd…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#141414; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         text-align:center; }
  .card { padding:32px; max-width:320px; }
  .logo { font-size:30px; font-weight:800; color:#FF6B4A; letter-spacing:.5px; }
  p { color:#bbb; font-size:15px; line-height:1.5; }
  a.btn { display:inline-block; margin-top:12px; padding:14px 30px; background:#FF6B4A; color:#fff;
          border-radius:999px; text-decoration:none; font-weight:700; font-size:16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Spotd</div>
  <p id="msg">Opening the app…</p>
  <a class="btn" href="/app-download">Get the app</a>
</div>
<script>
(function () {
  // Smart link: try the native app first, fall back to the App Store.
  var params = new URLSearchParams(location.search);
  var deep = params.get('to') || 'spotd://';
  if (!/^spotd:\/\//i.test(deep)) deep = 'spotd://'; // only allow spotd:// targets
  var done = false;
  function goStore() {
    if (done) return; done = true;
    document.getElementById('msg').textContent = 'Taking you to the App Store…';
    location.href = '/app-download';
  }
  // If the app opens, this page gets hidden — cancel the fallback.
  document.addEventListener('visibilitychange', function () { if (document.hidden) done = true; });
  window.addEventListener('pagehide', function () { done = true; });
  setTimeout(goStore, 2000);
  try { location.href = deep; } catch (e) { goStore(); }
})();
</script>
</body>
</html>
